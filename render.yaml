services:
  - type: web
    name: rocks-and-teas-pos
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Manila
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
