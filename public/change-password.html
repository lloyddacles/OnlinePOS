<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password - Rocks and Teas</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo">🔒</div>
    <h1>Change <span>Password</span></h1>
    <div class="subtitle">For security, you must set a new password before continuing.</div>
    <form id="pwForm">
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" id="pwCurrent" autocomplete="current-password" autofocus />
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="pwNext" autocomplete="new-password" placeholder="At least 6 characters" />
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="pwConfirm" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Update Password</button>
    </form>
    <div class="login-hint">Keep this password safe — you'll need it to sign in next time.</div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/js/common.js"></script>
  <script src="/js/change-password.js"></script>
</body>
</html>
