<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Rocks and Teas</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo">🍵</div>
    <h1>Rocks &amp; <span>Teas</span></h1>
    <div class="subtitle">Sign in to the store dashboard</div>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" autocomplete="username" placeholder="admin" autofocus />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
    </form>
    <div class="login-hint">Default: <strong>admin</strong> / <strong>admin123</strong></div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
